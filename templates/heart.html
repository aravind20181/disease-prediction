<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heart Disease Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Heart Disease Prediction</h1>
    <form method="POST">
        <label>Age:</label> <input type="number" name="age" required><br>
        <label>Sex (0=F,1=M):</label> <input type="number" name="sex" required><br>
        <label>Chest Pain Type (0-3):</label> <input type="number" name="cp" required><br>
        <label>Resting BP:</label> <input type="number" name="trestbps" required><br>
        <label>Cholesterol:</label> <input type="number" name="chol" required><br>
        <label>Fasting BS (0/1):</label> <input type="number" name="fbs" required><br>
        <label>Rest ECG (0-2):</label> <input type="number" name="restecg" required><br>
        <label>BPM:</label> <input type="number" name="thalach" required><br>
        <label>Exercise Angina (0/1):</label> <input type="number" name="exang" required><br>
        <label>Oldpeak:</label> <input type="number" step="0.1" name="oldpeak" required><br>
        <label>Slope (0-2):</label> <input type="number" name="slope" required><br>
        <label>CA (0-3):</label> <input type="number" name="ca" required><br>
        <label>Thal (1-3):</label> <input type="number" name="thal" required><br>
        <button type="submit">Predict</button>
    </form>
</div>
</body>
</html>
